{% extends 'base.html' %}

{% block title %}Сторінку не знайдено (404) - MySystem{% endblock %}

{% block content %}
<div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 text-center bg-white w-full" style="max-width: 480px;">

    <h1 class="display-1 fw-extrabold text-primary mb-2">404</h1>

    <h2 class="h3 fw-bold text-dark mb-3">Сторінку не знайдено</h2>

    <p class="text-muted mb-4">Вибачте, запитувана вами сторінка не існує або була переміщена.</p>

    <div class="d-grid gap-2">
        <!-- Исправлено: добавлено пространство имен main:home -->
        <a href="{% url 'main:home' %}" class="btn btn-primary btn-lg shadow-sm rounded-3">
            На головну
        </a>
    </div>

</div>
{% endblock %}
