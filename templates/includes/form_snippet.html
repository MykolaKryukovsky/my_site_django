{% csrf_token %}

{% if form.non_field_errors %}
    <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-4">
        {% for error in form.non_field_errors %}
            <p class="text-sm text-red-700">{{ error }}</p>
        {% endfor %}
    </div>
{% endif %}

{% for field in form %}
    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">
            {{ field.label }}
        </label>

        <div class="mt-1">
            {{ field }}
        </div>

        <script>
            document.getElementById('{{ field.id_for_label }}').classList.add('w-full', 'px-3', 'py-2', 'border', 'border-gray-300', 'rounded-lg', 'focus:outline-none', 'focus:ring-2', 'focus:ring-indigo-500');
        </script>

        {% if field.errors %}
            {% for error in field.errors %}
                <p class="text-xs text-red-600 mt-1">{{ error }}</p>
            {% endfor %}
        {% endif %}
    </div>
{% endfor %}
