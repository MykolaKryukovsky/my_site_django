{% extends 'base.html' %}

{% block title %}Створення команди{% endblock %}

{% block content %}
<h3 class="mb-4 text-center text-primary">Новий проєкт</h3>

<form method="post" novalidate>
    {% csrf_token %}

    {% for field in form %}
        <div class="mb-3">
            <label class="form-label font-weight-bold">{{ field.label }}</label>

            <div class="input-group">
                {{ field }}
            </div>

            {% if field.errors %}
                <div class="text-danger small mt-1">
                    {% for error in field.errors %}
                        <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn-primary w-100 mt-3">
        <i class="fa-solid fa-circle-plus"></i> Створити команду
    </button>
</form>
{% endblock %}
